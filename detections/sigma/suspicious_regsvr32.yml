title: Suspicious Regsvr32 Execution
id: 6b2d9f41-8c73-4a15-b206-5e9d7f31c842
status: experimental
description: Detects suspicious regsvr32 execution involving remote or script-based content.
author: Fernando Bahia
date: 2026/08/19

logsource:
    category: process_creation
    product: windows

detection:
    selection_image:
        Image|endswith:
            - '\regsvr32.exe'

    selection_suspicious:
        CommandLine|contains:
            - 'http://'
            - 'https://'
            - '/s'
            - 'scrobj.dll'
            - '.sct'

    condition: selection_image and selection_suspicious

falsepositives:
    - Legitimate software registration
    - Enterprise application installers

level: high

tags:
    - attack.t1218.010
