title: Suspicious Mshta Execution
id: 4c8a2f31-6b72-4d95-a183-9e5f7c2b6410
status: experimental
description: Detects mshta execution commonly associated with remote or script-based execution.
author: Fernando Bahia
date: 2026/08/19

logsource:
    category: process_creation
    product: windows

detection:
    selection_image:
        Image|endswith:
            - '\mshta.exe'

    selection_suspicious:
        CommandLine|contains:
            - 'http://'
            - 'https://'
            - '.hta'
            - 'javascript:'
            - 'vbscript:'

    condition: selection_image and selection_suspicious

falsepositives:
    - Legitimate enterprise HTA applications
    - Legacy administrative tooling

level: high

tags:
    - attack.t1218.005
    - attack.execution
