status: experimental
description: Detects execution through the Windows mshta utility.
author: Fernando Bahia
date: 2026/08/18
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - '\mshta.exe'
    condition: selection
