title: Suspicious Certutil Download Activity
id: 91c4e8b2-5d73-4f16-a9e2-7b638c25d401
status: experimental
description: Detects certutil being used to download or retrieve remote content.
author: Fernando Bahia
date: 2026/08/18
logsource:
    category: process_creation
    product: windows
detection:
    selection_image:
        Image|endswith:
            - '\certutil.exe'
    selection_download:
        CommandLine|contains:
            - '-urlcache'
            - '-split'
    condition: selection_image and selection_download
falsepositives:
    - Legitimate certificate administration
    - Enterprise certificate management
level: high
tags:
    - attack.command-and-control
    - attack.t1105
