title: Suspicious PowerShell WebClient Activity
id: 2d6f8a41-93b7-4e25-b608-71c5d294fa83
status: experimental
description: Detects PowerShell usage of .NET WebClient methods commonly associated with remote content retrieval.
author: Fernando Bahia
date: 2026/08/18
logsource:
    category: process_creation
    product: windows
detection:
    selection_image:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
    selection_webclient:
        CommandLine|contains:
            - 'WebClient'
            - 'DownloadString'
            - 'DownloadFile'
    condition: selection_image and selection_webclient
falsepositives:
    - Administrative automation
    - Software deployment
level: medium
tags:
    - attack.command-and-control
    - attack.t1059.001
    - attack.t1105
