apiVersion: batch/v1
kind: Job
metadata:
  name: detection-pipeline
  namespace: detection-lab
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: detection-pipeline
    spec:
      restartPolicy: Never
      containers:
        - name: detection-pipeline
          image: docker-detection-lab:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: detection-lab-config
